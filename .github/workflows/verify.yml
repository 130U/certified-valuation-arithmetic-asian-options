name: Verify certificates and manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - run: python code/run.py verify
      - run: python code/run.py run --module all --independent
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/build_report.py
      - run: python scripts/check_report.py
      - run: python scripts/verify_revision.py
      - run: git diff --exit-code -- manuscript
  targeted_examples:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - run: python code/revision/round2/asian_parameter_point.py prepare --directory code/runs/second-point-ci
      - run: python code/revision/round2/asian_parameter_point.py run --directory code/runs/second-point-ci
      - name: Test owned subprocess failure boundaries
        run: python -B -X utf8 code/revision/round2/test_runner_boundary.py --directory code/runs/runner-boundary-ci --reference code/runs/second-point-ci
      - run: python code/revision/round2_coupling_example.py --output code/runs/coupling-ci.json
      - run: python scripts/verify_fresh_examples.py --point code/runs/second-point-ci/result-capsule.json --coupling code/runs/coupling-ci.json
  pdf_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -r scripts/pdf/requirements.txt
      - run: python scripts/build_report.py
      - run: python scripts/pdf/build_pdf.py --language en
      - run: python scripts/pdf/build_pdf.py --language zh
      - run: python scripts/verify_pdf_build.py
      - run: git diff --exit-code -- manuscript paper/paper.pdf paper/paper-zh.pdf
