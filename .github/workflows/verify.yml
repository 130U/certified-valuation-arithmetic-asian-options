name: Verify certificates and manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - run: python code/run.py verify
      - run: python code/run.py run --module all --independent
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_report.py
      - run: python scripts/check_report.py
      - run: git diff --exit-code -- manuscript
