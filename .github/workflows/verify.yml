name: Verify certificates and presentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - run: python code/run.py verify
      - run: python code/run.py run --module all --independent
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: git diff --exit-code -- docs manuscript
